name: Flight Board
description: Turn a table into an animated flight board in your README.
author: j3551ca
branding:
  icon: grid
  color: yellow
inputs:
  config:
    description: Path to your board configuration, relative to your repository root.
    default: flight-board.yml
outputs:
  assets-dir:
    description: Generated assets directory.
    value: ${{ steps.render.outputs.assets-dir }}
  readme:
    description: Updated README path (empty if disabled).
    value: ${{ steps.render.outputs.readme }}
  image:
    description: Generated board image path.
    value: ${{ steps.render.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Render board
      id: render
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        BOARD_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        environment_dir="$(mktemp -d "$RUNNER_TEMP/flight-board.XXXXXX")"
        trap 'rm -rf "$environment_dir"' EXIT
        python -m venv "$environment_dir"
        "$environment_dir/bin/python" -m pip install --disable-pip-version-check \
          -r "$ACTION_ROOT/requirements-action.txt"
        PYTHONPATH="$ACTION_ROOT" "$environment_dir/bin/python" -m flight_board \
          --workspace "$GITHUB_WORKSPACE" --config "$BOARD_CONFIG"
