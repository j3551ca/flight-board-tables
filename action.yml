name: Flight Board
description: Render a configurable split-flap GIF and optional airport signs from CSV, JSON or Markdown.
author: j3551ca
branding:
  icon: grid
  color: yellow
inputs:
  config:
    description: Workspace-relative YAML config. Empty uses flight-board.yml if present.
    default: ''
  source:
    description: Override the source CSV, JSON or Markdown path.
    default: ''
  title:
    description: Override the board header.
    default: ''
  team:
    description: Override the organization or team name.
    default: ''
  output-dir:
    description: Override the dedicated generated assets directory.
    default: ''
  readme:
    description: Override the README path.
    default: ''
  no-animation:
    description: Use the static PNG in the README.
    default: 'false'
  no-buttons:
    description: Omit configured navigation signs.
    default: 'false'
  no-readme:
    description: Generate assets without editing a README.
    default: 'false'
outputs:
  assets-dir:
    description: Workspace-relative directory containing the generated files.
    value: ${{ steps.render.outputs.assets-dir }}
  readme:
    description: Updated README path, or empty when README updates are disabled.
    value: ${{ steps.render.outputs.readme }}
  image:
    description: Workspace-relative GIF or PNG used in the README.
    value: ${{ steps.render.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - name: Render flight board
      id: render
      shell: bash
      env:
        FB_ACTION_PATH: ${{ github.action_path }}
        FB_CONFIG: ${{ inputs.config }}
        FB_SOURCE: ${{ inputs.source }}
        FB_TITLE: ${{ inputs.title }}
        FB_TEAM: ${{ inputs.team }}
        FB_OUTPUT_DIR: ${{ inputs.output-dir }}
        FB_README: ${{ inputs.readme }}
        FB_NO_ANIMATION: ${{ inputs.no-animation }}
        FB_NO_BUTTONS: ${{ inputs.no-buttons }}
        FB_NO_README: ${{ inputs.no-readme }}
      run: |
        set -euo pipefail
        environment_dir="$(mktemp -d "$RUNNER_TEMP/flight-board.XXXXXX")"
        trap 'rm -rf "$environment_dir"' EXIT
        python -m venv "$environment_dir"
        "$environment_dir/bin/python" -m pip install --disable-pip-version-check \
          -r "$FB_ACTION_PATH/requirements-action.txt"
        PYTHONPATH="$FB_ACTION_PATH" "$environment_dir/bin/python" -m flight_board.action
