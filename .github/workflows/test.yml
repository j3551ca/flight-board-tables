name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy flight_board extras
      - run: pytest -q
      - run: python -m flight_board --config demo/flight-board.yml --validate-only
  composite-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp starter/board.csv board.csv
      - uses: ./
        with:
          config: starter/flight-board.yml
  public-consumer:
    if: startsWith(github.ref, 'refs/tags/v2')
    runs-on: ubuntu-latest
    steps:
      - name: Create a consumer workspace without the renderer source
        run: |
          printf 'Pipeline,Status\nExternal pipeline,Passed\n' > board.csv
          printf 'team: External team\nanimation: {enabled: false}\n' > flight-board.yml
          printf '# Consumer repository\n' > README.md
      - uses: j3551ca/flightboard_template@v2
        id: board
      - name: Check the result
        env:
          IMAGE: ${{ steps.board.outputs.image }}
        run: |
          test -f "$IMAGE"
          grep -q 'flight-board:start' README.md
