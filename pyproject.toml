[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-flight-board"
version = "2.1.0"
description = "Configurable split-flap status boards for repository READMEs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=11,<13", "PyYAML>=6,<7", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
flight-board = "flight_board.__main__:main"

[tool.setuptools.packages.find]
include = ["flight_board*"]

[tool.setuptools.package-data]
flight_board = ["fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
